repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.1
    hooks:
    -   id: ruff
        args: ["--select=E,W,F", "--ignore=E501"]
-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
    -   id: mypy
        args: ["--ignore-missing-imports", "--no-error-summary", "--strict-optional", "--explicit-package-bases"]
        additional_dependencies: ["pydantic>=2.4.0"]
        files: "^bummdidumm_os_v5_final_release/shared/|^bummdidumm_os_v5_final_release/personal_brain/utils\\.py"
