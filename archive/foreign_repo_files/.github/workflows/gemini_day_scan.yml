name: gemini-day-scan

on:
  workflow_dispatch:
  schedule:
    - cron: '20 5 * * *'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  run-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Gemini day scan
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3-flash-preview
          DATE_FROM: 2026-03-23
          DATE_TO: 2026-04-15
          WRITE_DEBUG: '1'
          DEBUG_DIR: debug_gemini_day_scan
        run: |
          # Use PYTHONPATH to ensure imports work correctly
          export PYTHONPATH=$PYTHONPATH:.
          python scraper/gemini_day_scan.py

      - name: Prepare static site
        run: |
          mkdir -p public/data
          cp index.html public/
          cp debug_gemini_day_scan/summary.json public/data/
          cp debug_gemini_day_scan/merged_events.json public/data/
          # Also copy other interesting files if needed
          cp debug_gemini_day_scan/scan_reports.json public/data/ || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: run-scan
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
