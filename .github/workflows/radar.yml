name: Basel Radar

on:
  schedule:
    # Täglich 06:00 UTC (= 07:00 MEZ / 08:00 MESZ)
    - cron: "0 6 * * *"
    # Montags 11:00 UTC (= 12:00 MEZ / 13:00 MESZ) — Weekly Briefing
    - cron: "0 11 * * 1"
  workflow_dispatch:
    inputs:
      weekly:
        description: "Weekly Briefing generieren?"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Dependencies installieren
        run: pip install httpx beautifulsoup4 google-auth google-api-python-client

      - name: RA Scraper
        run: python scraper/ra_scraper.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: HTML Scraper
        run: python scraper/html_scraper.py

      - name: Deduplication
        run: python scraper/dedup.py

      - name: Artist Enrichment
        run: python scraper/artist_enrichment.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Briefing generieren
        run: |
          # Montag oder manuell mit weekly=true → Weekly Briefing
          if [ "$(date +%u)" = "1" ] || [ "${{ github.event.inputs.weekly }}" = "true" ]; then
            python scraper/gemini_summary.py --weekly
          else
            python scraper/gemini_summary.py
          fi
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: events_raw.json committen
        run: |
          git config user.name "Basel Radar Bot"
          git config user.email "bot@basel-radar"
          git add -f events_raw.json briefing_latest.md
          git diff --staged --quiet || git commit -m "chore: events update $(date +%Y-%m-%d)"
          git push
