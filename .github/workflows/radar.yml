name: Basel Radar

on:
  schedule:
    - cron: "0 6 * * *"      # Täglich 06:00 UTC — scrape + enrich
    - cron: "0 11 * * 1"     # Montags 12:00 MEZ — Weekly Briefing
  workflow_dispatch:
    inputs:
      weekly:
        description: "Weekly Briefing?"
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencies
        run: |
          pip install -r requirements.txt
          scrapling install
          playwright install chromium --with-deps

      - name: RA Scraper
        run: python scraper/ra_scraper.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: HTML Scraper
        run: python scraper/html_scraper.py

      - name: Deduplication
        run: python scraper/dedup.py

      - name: Artist Enrichment
        run: python scraper/artist_enrichment.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Weekly Briefing
        if: github.event.schedule == '0 11 * * 1' || github.event.inputs.weekly == 'true'
        run: python scraper/gemini_summary.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit & Push
        run: |
          git config user.name "Basel Radar Bot"
          git config user.email "bot@basel-radar"
          git add -f events_raw.json artist_cache.json briefing_latest.md || true
          git diff --staged --quiet || git commit -m "chore: events $(date +%Y-%m-%d)"
          git push
