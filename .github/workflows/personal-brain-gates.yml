name: personal-brain-gates

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint-and-hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pre-commit
      - run: pre-commit run --all-files

  personal-brain-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest pip-audit
      - run: pip install --no-deps -r bummdidumm_os_v5_final_release/requirements.lock
      - name: Security audit
        run: pip-audit -r bummdidumm_os_v5_final_release/requirements.lock --skip-editable
      - run: python3 bummdidumm_os_v5_final_release/release_audit.py
      - run: PYTHONPATH=bummdidumm_os_v5_final_release pytest bummdidumm_os_v5_final_release/tests/ -q

  deploy-shell-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate deploy.sh shell syntax
        run: bash -n bummdidumm_os_v5_final_release/deploy.sh
      - name: Shellcheck deploy.sh
        run: shellcheck bummdidumm_os_v5_final_release/deploy.sh

  finalization-protocol-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required governance files
        run: |
          test -f AGENT_FINALIZATION_PROTOCOL.md
          test -f CODEOWNERS
          test -f .pre-commit-config.yaml
          test -f REPO_GOVERNANCE_SETUP.md
      - name: Verify protocol contains Personal Brain checklist
        run: |
          grep -q "Personal Brain specific acceptance checklist" AGENT_FINALIZATION_PROTOCOL.md
          grep -q "source identity stable across rename/move/re-index" AGENT_FINALIZATION_PROTOCOL.md
          grep -q "no deleted temp paths persisted as canonical source paths" AGENT_FINALIZATION_PROTOCOL.md
